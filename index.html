<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager | To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Task Manager</h1>
        <p id="task-counter">0 tasks remaining</p>
      </header>

      <form id="todo-form" class="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          required
        />
        <button type="submit">Add Task</button>
      </form>

      <div class="controls">
        <div
          class="filters"
          id="filter-group"
          role="group"
          aria-label="Filter tasks"
        >
          <button type="button" class="filter-btn active" data-filter="all">
            All
          </button>
          <button type="button" class="filter-btn" data-filter="active">
            Active
          </button>
          <button type="button" class="filter-btn" data-filter="completed">
            Completed
          </button>
        </div>
        <button type="button" id="clear-completed" class="clear-btn">
          Clear Completed
        </button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-state" class="empty-state">No tasks to show.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
